<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="statewave-openrouter: OpenAI-compatible proxy that gives OpenRouter calls Statewave memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/>
    </marker>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- title block -->
  <text x="56" y="104" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff">statewave-openrouter</text>
  <text x="56" y="136" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#d1d5db">Drop-in proxy: OpenRouter + Statewave memory</text>
  <text x="56" y="168" font-family="Consolas, monospace" font-size="15" fill="#93c5fd">pip install statewave-openrouter</text>

  <!-- flow diagram -->
  <g font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#0b1220">
    <rect x="610" y="115" width="90" height="36" rx="8" fill="#e5e7eb"/>
    <text x="655" y="138" text-anchor="middle">Client</text>

    <rect x="760" y="95" width="150" height="76" rx="10" fill="#f59e0b"/>
    <text x="835" y="129" text-anchor="middle" font-weight="700">statewave-</text>
    <text x="835" y="149" text-anchor="middle" font-weight="700">openrouter</text>

    <rect x="980" y="58" width="150" height="36" rx="8" fill="#e5e7eb"/>
    <text x="1055" y="81" text-anchor="middle">OpenRouter</text>

    <rect x="980" y="168" width="150" height="36" rx="8" fill="#e5e7eb"/>
    <text x="1055" y="191" text-anchor="middle">Statewave</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="700" y1="133" x2="755" y2="133"/>
    <line x1="910" y1="118" x2="975" y2="83"/>
    <line x1="910" y1="150" x2="975" y2="182"/>
  </g>
  <text x="980" y="222" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#d1d5db">context in, episode out</text>
</svg>
